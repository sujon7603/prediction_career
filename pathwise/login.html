<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – Pathwise</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
<main class="auth-wrap">
  <a class="logo" href="/login"><span class="mark"></span><img src="/img/core4.png" alt="Pathwise"></a>

  <div class="auth-card">
    <h1 id="authTitle">Welcome back</h1>
    <p id="authSub" class="sub">Log in to predict your career and see your skill gap.</p>

    <div class="tabs" role="tablist">
      <button type="button" id="tabLogin" role="tab" aria-selected="true">Log in</button>
      <button type="button" id="tabSignup" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field" id="nameRow" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" maxlength="60" placeholder="Your name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Your password" required>
          <button type="button" id="togglePw">Show</button>
        </div>
        <small id="pwHint" hidden>Use at least 8 characters.</small>
      </div>

      <p id="authMsg" class="auth-msg" role="alert"></p>
      <button class="btn full" id="submitBtn" type="submit">Log in</button>
    </form>

    <p class="switch" id="switchText">New here? <button type="button" id="switchBtn">Create an account</button></p>
  </div>
</main>
<script src="/auth.js"></script>
</body>
</html>
